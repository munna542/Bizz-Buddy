<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizz Buddy · Complete SME Management Solution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login/Signup Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Login to Bizz Buddy</h2>
                <button class="close-modal" onclick="closeAuthModal()">&times;</button>
            </div>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div id="signupFields" style="display:none;">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role">
                            <option value="Staff">Staff</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="authSubmitBtn">Login</button>
                <p class="auth-switch">
                    <span id="switchText">Don't have an account?</span>
                    <a href="#" onclick="toggleAuthMode(event)">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div id="mainApp" class="app-wrapper" style="display:none;">
        <header class="main-header">
            <div class="header-top">
                <div>
                    <h1>⚡ Bizz Buddy</h1>
                    <p class="tagline">Centralized SME Management · Sales · Inventory · Expenses · Suppliers</p>
                </div>
                <div class="user-info">
                    <span id="currentUserName"></span>
                    <span id="currentUserRole" class="role-badge"></span>
                    <button onclick="logout()" class="logout-btn">Logout</button>
                </div>
            </div>
        </header>

        <nav class="module-tabs" id="moduleTabs">
            <!-- Tabs will be dynamically generated based on role -->
        </nav>

        <main id="module-content" class="module-container">
            <!-- Content loaded dynamically -->
        </main>

        <footer class="dashboard-footer">
            <div class="er-note">
                <span class="er-badge">🏢 SME Solution · Sales · Purchases · Inventory · Customers · Suppliers</span>
                <span class="notification-area" id="live-notification">🔔 System ready</span>
            </div>
        </footer>
    </div>

    <!-- CRUD Modal for adding/editing items -->
    <div id="crudModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="crudModalTitle">Add Item</h2>
                <button class="close-modal" onclick="closeCrudModal()">&times;</button>
            </div>
            <form id="crudForm" onsubmit="handleCrudSubmit(event)">
                <div id="crudFields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeCrudModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="db.json" type="application/json" id="json-db"></script>
    <script src="app.js"></script>
</body>
</html>
